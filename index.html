<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>士正班115-2期協同準則抽題系統</title>
<style>
    :root{
      --bg:#f3f5f7;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --primary:#355f3d;
      --primary-dark:#27482e;
      --accent:#d8e5da;
      --border:#e5e7eb;
      --shadow:0 8px 24px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:linear-gradient(180deg,#e8efe9 0,#f5f7f5 260px,#f3f5f7 100%);
      color:var(--text);
    }

    .wrap{
      width:min(1100px,92%);
      margin:0 auto;
      padding:36px 0 50px;
    }

    .hero{
      text-align:center;
      margin-bottom:28px;
    }

    .hero h1{
      margin:0;
      font-size:clamp(30px,5vw,48px);
      letter-spacing:.08em;
      color:#23402a;
    }

    .hero p{
      color:var(--muted);
      margin:10px 0 0;
      font-size:16px;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin:24px 0;
    }

    .summary-item{
      background:rgba(255,255,255,.88);
      border:1px solid rgba(255,255,255,.7);
      box-shadow:var(--shadow);
      border-radius:18px;
      padding:16px;
      text-align:center;
    }

    .summary-item b{
      display:block;
      font-size:28px;
      color:var(--primary);
      margin-top:4px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      padding:22px;
      box-shadow:var(--shadow);
    }

    .part{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 10px;
      border-radius:999px;
      background:var(--accent);
      color:var(--primary-dark);
      font-weight:700;
      font-size:13px;
      margin-bottom:12px;
    }

    .card h2{
      margin:0 0 10px;
      font-size:20px;
      line-height:1.45;
    }

    .meta{
      color:var(--muted);
      font-size:14px;
      margin-bottom:16px;
    }

    .numbers{
      min-height:92px;
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      align-content:flex-start;
      padding:14px;
      border-radius:16px;
      background:#f7f9f7;
      border:1px dashed #cbd5cb;
      margin-bottom:16px;
    }

    .placeholder{
      color:#9ca3af;
      font-size:14px;
      align-self:center;
      margin:auto;
    }

    .ball{
      width:46px;
      height:46px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--primary);
      color:#fff;
      font-weight:800;
      font-size:17px;
      box-shadow:0 4px 10px rgba(53,95,61,.25);
    }

    button{
      border:none;
      cursor:pointer;
      font:inherit;
      transition:.18s ease;
    }

    .draw-btn{
      width:100%;
      border-radius:14px;
      padding:12px 16px;
      background:var(--primary);
      color:#fff;
      font-weight:700;
    }

    .draw-btn:hover{background:var(--primary-dark)}
    .draw-btn:active{transform:scale(.99)}

    .actions{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:24px;
      flex-wrap:wrap;
    }

    .actions button{
      border-radius:15px;
      padding:14px 24px;
      font-weight:800;
    }

    .all-btn{
      background:#1f3d26;
      color:white;
    }

    .reset-btn{
      background:white;
      color:#374151;
      border:1px solid var(--border);
    }

    .result-box{
      display:none;
      margin-top:26px;
      background:#213a27;
      color:#fff;
      border-radius:22px;
      padding:22px;
      box-shadow:var(--shadow);
    }

    .result-box h3{
      margin:0 0 12px;
      font-size:20px;
    }

    .result-text{
      line-height:1.8;
      white-space:pre-line;
      font-size:15px;
    }

    .footer{
      text-align:center;
      color:#9ca3af;
      font-size:12px;
      margin-top:28px;
    }


    .range-box{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:10px;
      align-items:center;
      margin:0 0 14px;
      padding:12px;
      border-radius:14px;
      background:#f7f9f7;
      border:1px solid var(--border);
    }

    .range-box label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .range-box input{
      width:100%;
      border:1px solid #cfd6d0;
      border-radius:10px;
      padding:10px 9px;
      font:inherit;
      text-align:center;
      background:#fff;
      color:var(--text);
      outline:none;
    }

    .range-box input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(53,95,61,.10);
    }

    .range-sep{
      color:#6b7280;
      font-weight:700;
      padding-top:18px;
    }

    .range-note{
      grid-column:1 / -1;
      color:#7b837d;
      font-size:12px;
      line-height:1.45;
    }

    @media(max-width:760px){
      .wrap{width:min(94%,680px);padding-top:24px}
      .grid{grid-template-columns:1fr}
      .summary{grid-template-columns:1fr 1fr 1fr}
      .summary-item{padding:12px 8px;border-radius:14px}
      .summary-item span{font-size:12px}
      .summary-item b{font-size:22px}
      .card{padding:18px}
      .ball{width:42px;height:42px;font-size:16px}
    }
  
    /* 抽中題號：縮小圓圈、單行置中 */
    .numbers, .result, .result-numbers, .number-list{
      display:flex !important;
      flex-wrap:nowrap !important;
      justify-content:center !important;
      align-items:center !important;
      gap:6px !important;
      width:100% !important;
      overflow-x:auto;
    }

    .ball, .number, .number-ball, .num{
      width:34px !important;
      height:34px !important;
      min-width:34px !important;
      flex:0 0 34px !important;
      font-size:14px !important;
      line-height:34px !important;
      padding:0 !important;
      margin:0 !important;
    }


/* ===== 後台管理 ===== */
.hero-title-row{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
.hero-title-row h1{
  width:100%;
  margin:0;
  padding:0 34px;
  text-align:center;
}
.gear-btn{
  position:absolute;
  right:2px;
  top:50%;
  transform:translateY(-50%);
  width:26px;
  height:26px;
  min-width:26px;
  min-height:26px;
  padding:0;
  margin:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#355f3d;
  font-size:16px;
  line-height:26px;
  cursor:pointer;
  z-index:100;
}
.gear-btn:active{
  transform:translateY(-50%) scale(.92);
}

.admin-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.48);
}
.admin-modal.show{display:flex}

.admin-panel{
  width:min(460px,100%);
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.28);
}
.admin-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.admin-title{
  font-size:21px;
  font-weight:900;
  color:#23402a;
}
.admin-subtitle{
  margin-top:3px;
  color:#6b7280;
  font-size:12px;
}
.admin-close{
  width:34px;
  height:34px;
  min-width:34px;
  padding:0;
  border-radius:10px;
  background:#eef1ee;
  color:#374151;
  font-size:22px;
}
.admin-field{
  margin-bottom:12px;
}
.admin-field label{
  display:block;
  margin-bottom:5px;
  color:#6b7280;
  font-size:12px;
  font-weight:800;
}
.admin-field input{
  width:100%;
  height:44px;
  padding:8px 10px;
  border:1px solid #cfd6d0;
  border-radius:10px;
  background:#fff;
  color:#1f2937;
  font:inherit;
  outline:none;
}
.admin-field input:focus{
  border-color:#355f3d;
  box-shadow:0 0 0 3px rgba(53,95,61,.10);
}
.admin-range{
  display:grid;
  grid-template-columns:1fr 28px 1fr;
  gap:8px;
  align-items:end;
}
.admin-range-sep{
  text-align:center;
  padding-bottom:12px;
  color:#6b7280;
  font-weight:900;
}
.admin-preview{
  margin-top:10px;
  padding:10px;
  border:1px dashed #cbd5cb;
  border-radius:10px;
  background:#f7f9f7;
  color:#4b5563;
  font-size:12px;
  line-height:1.6;
}
.admin-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.admin-actions button{
  min-height:43px;
  border-radius:11px;
  font-weight:800;
}
.admin-secondary{
  background:#eef1ee;
  color:#374151;
}
.admin-primary{
  background:#355f3d;
  color:#fff;
}
.login-error{
  min-height:18px;
  margin-top:2px;
  color:#b42318;
  font-size:12px;
  font-weight:800;
}
@media(max-width:760px){
  .hero-title-row h1{padding:0 30px}
  .gear-btn{
    right:0;
    width:23px;
    height:23px;
    min-width:23px;
    min-height:23px;
    font-size:14px;
    line-height:23px;
  }
  .admin-panel{padding:15px}
  .admin-title{font-size:19px}
}


.length-details{
  margin-top:12px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  background:#fff;
  overflow:hidden;
}
.length-details summary{
  cursor:pointer;
  padding:11px 12px;
  font-size:13px;
  font-weight:800;
  color:#355f3d;
  background:#f7f9f7;
}
.answer-length-details{
  max-height:300px;
  overflow:auto;
  padding:10px 12px;
}
.length-subject{
  margin-bottom:12px;
}
.length-subject:last-child{margin-bottom:0}
.length-subject-title{
  margin-bottom:6px;
  font-size:12px;
  font-weight:900;
  color:#23402a;
}
.length-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.length-chip{
  display:inline-flex;
  align-items:center;
  padding:5px 7px;
  border-radius:8px;
  background:#f3f5f7;
  border:1px solid #e5e7eb;
  font-size:11px;
  color:#374151;
}
.length-chip.in-range{
  background:#d8e5da;
  border-color:#b8cbbd;
  color:#23402a;
  font-weight:800;
}


.preview-total{
  margin-bottom:10px;
  color:#23402a;
}
.preview-subject{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #e5e7eb;
}
.preview-subject:first-of-type{
  border-top:0;
  padding-top:0;
}
.preview-subject span{
  display:block;
  margin-top:4px;
  line-height:1.7;
}
.no-match{
  color:#9ca3af;
  font-size:12px;
}


.footer-admin-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-left:6px;
  padding:0;
  border:0;
  background:transparent;
  color:inherit;
  font:inherit;
  font-size:15px;
  line-height:1;
  cursor:pointer;
  vertical-align:middle;
  opacity:.85;
  position:relative;
  z-index:100;
}
.footer-admin-btn:hover{opacity:1}
.footer-admin-btn:active{transform:scale(.94)}


/* ===== 手機版最佳化 ===== */
@media (max-width: 768px){
  html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  body{
    padding:12px 10px 24px;
  }

  .container,
  .wrap,
  main{
    width:100% !important;
    max-width:100% !important;
    margin:0 auto !important;
  }

  .hero{
    padding:16px 12px !important;
    border-radius:16px !important;
  }

  .hero-title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  h1,
  .hero h1{
    font-size:22px !important;
    line-height:1.35 !important;
    text-align:center;
    margin:0 !important;
  }

  .grid,
  .cards,
  .card-grid{
    display:grid !important;
    grid-template-columns:1fr !important;
    gap:12px !important;
  }

  .card{
    width:100% !important;
    min-width:0 !important;
    padding:16px 14px !important;
    border-radius:16px !important;
  }

  .card h2,
  .card-title{
    font-size:18px !important;
    line-height:1.45 !important;
  }

  .range-row,
  .input-row,
  .controls,
  .actions{
    display:flex !important;
    flex-wrap:wrap !important;
    gap:8px !important;
    align-items:center !important;
  }

  input[type="number"],
  input[type="text"],
  input[type="password"]{
    font-size:16px !important; /* 防止 iPhone 自動放大 */
    min-height:44px !important;
    box-sizing:border-box !important;
  }

  .range-row input,
  .input-row input{
    flex:1 1 110px !important;
    min-width:0 !important;
  }

  button{
    min-height:44px;
    touch-action:manipulation;
  }

  .draw-btn,
  .btn,
  .primary-btn,
  .secondary-btn{
    font-size:15px !important;
  }

  .numbers,
  .number-list,
  .result-numbers{
    display:flex !important;
    flex-wrap:wrap !important;
    justify-content:center !important;
    gap:8px !important;
    overflow:visible !important;
    white-space:normal !important;
  }

  .number,
  .ball,
  .result-number{
    flex:0 0 auto !important;
  }

  .summary,
  #summaryText{
    font-size:14px !important;
    line-height:1.75 !important;
    white-space:pre-wrap !important;
    word-break:break-word !important;
  }

  .admin-modal{
    padding:12px !important;
    align-items:center !important;
  }

  .admin-box,
  .admin-panel{
    width:min(94vw, 520px) !important;
    max-width:94vw !important;
    max-height:88vh !important;
    overflow-y:auto !important;
    margin:auto !important;
    border-radius:16px !important;
    box-sizing:border-box !important;
  }

  .admin-form-row{
    display:flex !important;
    flex-direction:column !important;
    align-items:stretch !important;
    gap:8px !important;
  }

  .admin-form-row label{
    width:auto !important;
  }

  .admin-actions{
    display:grid !important;
    grid-template-columns:1fr 1fr !important;
    gap:8px !important;
  }

  .admin-actions button{
    width:100% !important;
  }

  .length-details summary{
    font-size:13px !important;
    line-height:1.5 !important;
  }

  .answer-length-details{
    max-height:42vh !important;
  }

  .length-chips{
    gap:6px !important;
  }

  .length-chip{
    font-size:11px !important;
    padding:6px 7px !important;
  }

  footer{
    text-align:center !important;
    font-size:12px !important;
    line-height:1.8 !important;
    padding:14px 6px 6px !important;
  }

  .footer-admin-btn{
    font-size:16px !important;
    min-height:auto !important;
    min-width:auto !important;
  }
}

@media (max-width: 420px){
  body{
    padding-left:8px;
    padding-right:8px;
  }

  h1,
  .hero h1{
    font-size:20px !important;
  }

  .card{
    padding:14px 12px !important;
  }

  .admin-actions{
    grid-template-columns:1fr !important;
  }
}

</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="hero-title-row">
<h1>士正班115-2期協同準則抽題系統</h1>
</div>
</section>
<section class="summary">
<div class="summary-item"><span>準則科目</span><b>4</b></div>
<div class="summary-item"><span>題庫總數</span><b>100</b></div>
<div class="summary-item"><span>每次抽題</span><b>20</b></div>
</section>
<section class="grid">
<article class="card">
<h2>陸軍作戰要綱</h2>
<div class="meta">總數 45 題｜隨機抽 9 題</div><div class="range-box">
<div>
<label for="start1">起始題號</label>
<input id="start1" inputmode="numeric" max="45" min="1" type="number" value="1"/>
</div>
<div class="range-sep">～</div>
<div>
<label for="end1">結束題號</label>
<input id="end1" inputmode="numeric" max="45" min="1" type="number" value="45"/>
</div>
</div>

<div class="numbers" id="result1"><span class="placeholder">尚未抽題</span></div>
<button class="draw-btn" onclick="drawPartFromRange(1,45,9)">抽取第一部分</button>
</article>
<article class="card">
<h2>陸軍指揮參謀組織與作業教範</h2>
<div class="meta">總數 35 題｜隨機抽 7 題</div><div class="range-box">
<div>
<label for="start2">起始題號</label>
<input id="start2" inputmode="numeric" max="35" min="1" type="number" value="1"/>
</div>
<div class="range-sep">～</div>
<div>
<label for="end2">結束題號</label>
<input id="end2" inputmode="numeric" max="35" min="1" type="number" value="35"/>
</div>
</div>

<div class="numbers" id="result2"><span class="placeholder">尚未抽題</span></div>
<button class="draw-btn" onclick="drawPartFromRange(2,35,7)">抽取第二部分</button>
</article>
<article class="card">
<h2>陸軍戰場情報準備作業教範</h2>
<div class="meta">總數 10 題｜隨機抽 2 題</div><div class="range-box">
<div>
<label for="start3">起始題號</label>
<input id="start3" inputmode="numeric" max="10" min="1" type="number" value="1"/>
</div>
<div class="range-sep">～</div>
<div>
<label for="end3">結束題號</label>
<input id="end3" inputmode="numeric" max="10" min="1" type="number" value="10"/>
</div>
</div>


<div class="numbers" id="result3"><span class="placeholder">尚未抽題</span></div>
<button class="draw-btn" onclick="drawPartFromRange(3,10,2)">抽取第三部分</button>
</article>
<article class="card">
<h2>聯合兵種營作戰教範</h2>
<div class="meta">總數 10 題｜隨機抽 2 題</div><div class="range-box">
<div>
<label for="start4">起始題號</label>
<input id="start4" inputmode="numeric" max="10" min="1" type="number" value="1"/>
</div>
<div class="range-sep">～</div>
<div>
<label for="end4">結束題號</label>
<input id="end4" inputmode="numeric" max="10" min="1" type="number" value="10"/>
</div>
</div>
<div class="numbers" id="result4"><span class="placeholder">尚未抽題</span></div>
<button class="draw-btn" onclick="drawPartFromRange(4,10,2)">抽取第四部分</button>
</article>
</section>
<div class="actions">
<button class="all-btn" onclick="drawAll()">全部抽題</button>
<button class="reset-btn" onclick="resetAll()">清除結果</button>
</div>
<section class="result-box" id="summaryResult">
<h3>本次抽題結果</h3>
<div class="result-text" id="summaryText"></div>
</section>
<div class="footer">士官長正規班115-2期&nbsp;&nbsp;協同準則抽題系統<br>
@ ACEITC&nbsp;&nbsp;SGM4&nbsp;&nbsp;JHUNG <button class="footer-admin-btn" id="adminGearBtn" type="button" aria-label="後台管理">㊣</button></div>
</main>

<div id="adminLoginModal" class="admin-modal">
  <div class="admin-panel">
    <div class="admin-header">
      <div></div>
      <button class="admin-close" type="button" onclick="closeAdminLogin()">×</button>
    </div>

    <div class="admin-field">
      <label for="adminUser">帳號</label>
      <input id="adminUser" type="text" autocomplete="username">
    </div>

    <div class="admin-field">
      <label for="adminPass">密碼</label>
      <input id="adminPass" type="password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') submitAdminLogin()">
    </div>

    <div id="adminLoginError" class="login-error"></div>

    <div class="admin-actions">
      <button type="button" onclick="closeAdminLogin()" class="admin-secondary" type="button">取消</button>
      <button class="admin-primary" type="button" onclick="submitAdminLogin()">登入</button>
    </div>
  </div>
</div>

<div id="adminModal" class="admin-modal">
  <div class="admin-panel">
    <div class="admin-header">
      <div>
        <div class="admin-title">答案文字字數範圍設定</div>
        <div class="admin-subtitle">僅計算答案中的文字；數字、標點及空白不計</div>
      </div>
      <button class="admin-close" type="button" onclick="closeAdminModal()">×</button>
    </div>

    <div class="admin-range">
      <div class="admin-field">
        <label for="adminMinChars">最少文字字數</label>
        <input id="adminMinChars" type="number" min="1" value="1" oninput="updateAdminPreview()">
      </div>

      <div class="admin-range-sep">～</div>

      <div class="admin-field">
        <label for="adminMaxChars">最多文字字數</label>
        <input id="adminMaxChars" type="number" min="1" value="80" oninput="updateAdminPreview()">
      </div>
    </div>

    <div id="adminPreview" class="admin-preview" style="display:none"></div>

    <details class="length-details">
      <summary id="rangeSummary">答案文字字數範圍：1～60 個文字｜共 86 題符合</summary>
      <div id="answerLengthDetails" class="answer-length-details"></div>
    </details>


    <div class="admin-actions">
      <button class="admin-secondary" type="button" onclick="resetAdminSettings()">恢復 1～80 字</button>
      <button class="admin-primary" type="button" onclick="saveAdminSettings()">儲存設定</button>
    </div>
  </div>
</div>

<script>
  const names = {
    1: "陸軍作戰要綱",
    2: "陸軍指揮參謀組織與作業教範",
    3: "陸軍戰場情報準備作業教範",
    4: "聯合兵種營作戰教範"
  };

  const answerLengths = {"1":{"1":43,"2":42,"3":88,"4":36,"5":23,"6":15,"7":21,"8":10,"9":14,"10":40,"11":34,"12":10,"13":19,"14":71,"15":6,"16":51,"17":45,"18":38,"19":95,"20":30,"21":8,"22":83,"23":16,"24":13,"25":40,"26":34,"27":33,"28":15,"29":34,"30":96,"31":54,"32":19,"33":23,"34":19,"35":4,"36":28,"37":33,"38":45,"39":55,"40":77,"41":48,"42":9,"43":82,"44":32,"45":20},"2":{"1":26,"2":23,"3":34,"4":47,"5":29,"6":42,"7":17,"8":37,"9":38,"10":26,"11":56,"12":78,"13":50,"14":31,"15":63,"16":71,"17":24,"18":49,"19":8,"20":43,"21":56,"22":16,"23":70,"24":54,"25":64,"26":7,"27":36,"28":44,"29":9,"30":15,"31":18,"32":26,"33":27,"34":50,"35":68},"3":{"1":25,"2":96,"3":46,"4":20,"5":34,"6":40,"7":33,"8":60,"9":28,"10":34},"4":{"1":45,"2":45,"3":24,"4":16,"5":13,"6":8,"7":53,"8":20,"9":46,"10":15}};
  const state = {};

  const ADMIN_USERNAME = "SGM2026";
  const ADMIN_PASSWORD = "SGM2026";
  const ADMIN_STORAGE_KEY = "sgm2026_question_length_range";
  const defaultAdminSettings = { minChars: 1, maxChars: 80 };

  function loadAdminSettings(){
    try{
      const saved = JSON.parse(localStorage.getItem(ADMIN_STORAGE_KEY));
      if(saved && Number.isFinite(Number(saved.minChars)) && Number.isFinite(Number(saved.maxChars))){
        return {
          minChars: Math.max(1, Number(saved.minChars)),
          maxChars: Math.max(1, Number(saved.maxChars))
        };
      }
    }catch(e){}
    return {...defaultAdminSettings};
  }

  let adminSettings = loadAdminSettings();

  function render(part, numbers){
    const box = document.getElementById("result" + part);
    box.innerHTML = numbers.map(n => `<span class="ball">${n}</span>`).join("");
  }

  function getEligiblePool(part, start, end){
    const lengths = answerLengths[part] || {};
    return Object.keys(lengths)
      .map(Number)
      .filter(n => n >= start && n <= end)
      .filter(n => {
        const len = lengths[n];
        return len >= adminSettings.minChars && len <= adminSettings.maxChars;
      });
  }

  function drawPartFromRange(part, total, count){
    const startInput = document.getElementById("start" + part);
    const endInput = document.getElementById("end" + part);

    let start = parseInt(startInput.value, 10);
    let end = parseInt(endInput.value, 10);

    if(Number.isNaN(start) || Number.isNaN(end)){
      alert("請輸入起始題號與結束題號。");
      return;
    }

    start = Math.max(1, Math.min(total, start));
    end = Math.max(1, Math.min(total, end));

    if(start > end) [start, end] = [end, start];

    startInput.value = start;
    endInput.value = end;

    const pool = getEligiblePool(part, start, end);

    if(pool.length < count){
      alert(`所選範圍 ${start}～${end} 題中，符合後台設定「答案文字 ${adminSettings.minChars}～${adminSettings.maxChars} 個文字」的題目只有 ${pool.length} 題，不足抽取 ${count} 題。請擴大題號範圍或調整後台字數範圍。`);
      return;
    }

    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    const numbers = pool.slice(0, count).sort((a,b) => a-b);
    state[part] = numbers;
    render(part, numbers);
    updateSummary();
  }

  function drawPart(part, total, count){
    drawPartFromRange(part, total, count);
  }

  function drawAll(){
    drawPartFromRange(1,45,9);
    drawPartFromRange(2,35,7);
    drawPartFromRange(3,10,2);
    drawPartFromRange(4,10,2);
  }

  function resetAll(){
    Object.keys(state).forEach(k => delete state[k]);
    for(let i=1;i<=4;i++){
      document.getElementById("result"+i).innerHTML =
        '<span class="placeholder">尚未抽題</span>';
    }
    document.getElementById("summaryResult").style.display = "none";
    document.getElementById("summaryText").textContent = "";
  }

  function updateSummary(){
    const parts = [1,2,3,4].filter(p => state[p]);
    if(parts.length === 0) return;

    const lines = parts.map(p =>
      `第${["","一","二","三","四"][p]}部分｜${names[p]}\n題號：${state[p].join("、")}`
    );

    document.getElementById("summaryText").textContent = lines.join("\n\n");
    document.getElementById("summaryResult").style.display = "block";
  }

  
  function closeAdminModal(){
    const modal = document.getElementById("adminModal");
    if(modal) modal.classList.remove("show");
  }

  function openAdminLogin(){
    document.getElementById("adminUser").value = "";
    document.getElementById("adminPass").value = "";
    document.getElementById("adminLoginError").textContent = "";
    document.getElementById("adminLoginModal").classList.add("show");
    document.body.style.overflow = "hidden";
    setTimeout(() => document.getElementById("adminUser").focus(), 50);
  }

  function closeAdminLogin(){
    document.getElementById("adminLoginModal").classList.remove("show");
    document.body.style.overflow = "";
  }

  function submitAdminLogin(){
    const user = document.getElementById("adminUser").value.trim();
    const pass = document.getElementById("adminPass").value;

    if(user === ADMIN_USERNAME && pass === ADMIN_PASSWORD){
      closeAdminLogin();
      openAdmin();
    }else{
      document.getElementById("adminLoginError").textContent = "帳號或密碼錯誤";
    }
  }

  function openAdmin(){
    document.getElementById("adminMinChars").value = adminSettings.minChars;
    document.getElementById("adminMaxChars").value = adminSettings.maxChars;
    updateAdminPreview();
    document.getElementById("adminModal").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeAdmin(){
    document.getElementById("adminModal").classList.remove("show");
    document.body.style.overflow = "";
  }

  function saveAdminSettings(){
    let minChars = parseInt(document.getElementById("adminMinChars").value, 10);
    let maxChars = parseInt(document.getElementById("adminMaxChars").value, 10);

    if(Number.isNaN(minChars) || Number.isNaN(maxChars) || minChars < 1 || maxChars < 1){
      alert("字數範圍請輸入 1 以上的整數。");
      return;
    }

    if(minChars > maxChars) [minChars, maxChars] = [maxChars, minChars];

    adminSettings = { minChars, maxChars };
    localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(adminSettings));
    closeAdmin();
    alert(`設定完成：前端之後會依答案 ${minChars}～${maxChars} 個文字範圍抽取題號。`);
  }

  function resetAdminSettings(){
    adminSettings = {...defaultAdminSettings};
    localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(adminSettings));
    document.getElementById("adminMinChars").value = 1;
    document.getElementById("adminMaxChars").value = 80;
    updateAdminPreview();
  }

  function updateAdminPreview(){
    const minVal = parseInt(document.getElementById("adminMinChars").value, 10);
    const maxVal = parseInt(document.getElementById("adminMaxChars").value, 10);

    if(Number.isNaN(minVal) || Number.isNaN(maxVal)) return;

    const lo = Math.min(minVal, maxVal);
    const hi = Math.max(minVal, maxVal);
    let total = 0;

    [1,2,3,4].forEach(part => {
      const matched = Object.entries(answerLengths[part] || {})
        .map(([q, len]) => [Number(q), Number(len)])
        .filter(([, len]) => len >= lo && len <= hi);

      total += matched.length;
    });

    const summary = document.getElementById("rangeSummary");
    if(summary){
      summary.textContent = `答案文字字數範圍：${lo}～${hi} 個文字｜共 ${total} 題符合`;
    }

    const preview = document.getElementById("adminPreview");
    if(preview){
      preview.innerHTML = "";
    }

    renderAnswerLengthDetails(lo, hi);
  }

  function renderAnswerLengthDetails(lo, hi){
    const box = document.getElementById("answerLengthDetails");
    if(!box) return;

    box.innerHTML = [1,2,3,4].map(part => {
      const matched = Object.entries(answerLengths[part] || {})
        .map(([q, len]) => [Number(q), Number(len)])
        .sort((a,b) => a[0] - b[0])
        .filter(([, len]) => len >= lo && len <= hi);

      const chips = matched.length
        ? matched.map(([q, len]) =>
            `<span class="length-chip in-range">第${q}題｜${len}個文字</span>`
          ).join("")
        : `<span class="no-match">此範圍內無符合答案</span>`;

      return `<div class="length-subject">
        <div class="length-subject-title">${names[part]}｜符合 ${matched.length} 題</div>
        <div class="length-chips">${chips}</div>
      </div>`;
    }).join("");
  }

  // 後台齒輪：1 秒內連續按三下才開啟登入視窗
  document.addEventListener("DOMContentLoaded", function(){
    const gear = document.getElementById("adminGearBtn");
    let gearClickCount = 0;
    let gearClickTimer = null;

    if(gear){
      gear.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();

        gearClickCount += 1;

        if(gearClickTimer){
          clearTimeout(gearClickTimer);
        }

        if(gearClickCount >= 3){
          gearClickCount = 0;
          gearClickTimer = null;
          openAdminLogin();
          return;
        }

        gearClickTimer = setTimeout(function(){
          gearClickCount = 0;
          gearClickTimer = null;
        }, 1000);
      });
    }

    // 登入與後台設定視窗只能按 X / 明確按鈕關閉，點空白不關閉
    ["adminLoginModal","adminModal"].forEach(function(id){
      const modal = document.getElementById(id);
      if(modal){
        modal.addEventListener("click", function(e){
          e.stopPropagation();
        });
      }
    });
  });

</script>
</body>
</html>
